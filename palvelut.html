<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Palvelut</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Navigaatio -->
<nav class="navbar navbar-expand-sm custom">
  <div class="container-fluid">
    <!-- Linkit-->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" href="#">Etusivu</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Palvelut</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#">Yhteystiedot</a>
      </li>
    </ul>
  </div>

  <!-- Pääsisältö -->
    <main id="palvelut" class="container">
        <h1>Palvelut</h1>
        <p>Tarjoamme monipuolisia palveluita.</p>
    </main>

<!-- Karuselli -->
<div id="karuselli" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicators/dots -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#karuselli" data-bs-slide-to="0" class="active"></button>
    <button type="button" data-bs-target="#karuselli" data-bs-slide-to="1"></button>
    <button type="button" data-bs-target="#karuselli" data-bs-slide-to="2"></button>
  </div>

  <!-- The slideshow/carousel -->
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="kankaan-leikkaus.jpg" alt="Kankaan leikkaus" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="sovitus.jpg" alt="Vaatteiden räätälöinti" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="vaaterekki.jpg" alt="Vaatemyynti" class="d-block w-100">
    </div>
  </div>

  <!-- Left and right controls/icons -->
  <button class="carousel-control-prev" type="button" data-bs-target="#karuselli" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#karuselli" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span>
  </button>
</div>

</body>
</html>
